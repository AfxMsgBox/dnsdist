-- dnsdist policy gateway for a WireGuard network.
-- Environment values are loaded by the dnsdist systemd drop-in.

local INSTALL_DIR = os.getenv("DNSDIST_INSTALL_DIR") or "/opt/mydnsdist"
local WG_DNS_IP = os.getenv("DNSDIST_WG_DNS_IP") or "10.133.0.1"
local WG_NETWORK = os.getenv("DNSDIST_WG_NETWORK") or "10.133.0.0/24"
local MIHOMO_ADDRESS = os.getenv("DNSDIST_MIHOMO_ADDRESS") or "127.0.0.1:253"
local ALIDNS_1 = os.getenv("DNSDIST_ALIDNS_1") or "223.5.5.5:53"
local ALIDNS_2 = os.getenv("DNSDIST_ALIDNS_2") or "223.6.6.6:53"

setLocal(WG_DNS_IP .. ":53")
setACL({
  WG_NETWORK,
  "127.0.0.0/8",
  "::1/128",
})

-- Proxy-domain backend. dnsdist does not synthesize ECS for this pool.
newServer({
  address = MIHOMO_ADDRESS,
  name = "mihomo",
  pool = "mihomo",
  useClientSubnet = false,
})

-- ECS-enabled AliDNS pool. These server objects are separate from the
-- no-ECS pool because useClientSubnet is a server property, not a pool property.
newServer({
  address = ALIDNS_1,
  name = "alidns-1-ecs",
  pool = "china-ecs",
  useClientSubnet = true,
})
newServer({
  address = ALIDNS_2,
  name = "alidns-2-ecs",
  pool = "china-ecs",
  useClientSubnet = true,
})

newServer({
  address = ALIDNS_1,
  name = "alidns-1-noecs",
  pool = "china-noecs",
  useClientSubnet = false,
})
newServer({
  address = ALIDNS_2,
  name = "alidns-2-noecs",
  pool = "china-noecs",
  useClientSubnet = false,
})

local domainRules = dofile(INSTALL_DIR .. "/generated/domain-rules.lua")

-- Important blocking rules override AdGuard exception rules.
for index, selector in ipairs(domainRules.important) do
  addAction(
    selector,
    RCodeAction(DNSRCode.NXDOMAIN),
    { name = "block-important-ad-" .. index }
  )
end

-- Exceptions are recorded as a tag. Normal blocking selectors test that tag,
-- so matching is independent of whether a rule was exact, suffix, regex or QTYPE.
for _, selector in ipairs(domainRules.allow) do
  addAction(selector, SetTagAction("ad-allow", "1"))
end

for index, selector in ipairs(domainRules.block) do
  addAction(
    AndRule({ selector, NotRule(TagRule("ad-allow", "1")) }),
    RCodeAction(DNSRCode.NXDOMAIN),
    { name = "block-ad-" .. index }
  )
end

for index, selector in ipairs(domainRules.proxy) do
  addAction(
    selector,
    PoolAction("mihomo"),
    { name = "route-proxy-domains-" .. index }
  )
end

domainRules = nil
collectgarbage("collect")

-- This file adds three ordered actions per known peer: override incoming ECS,
-- set the endpoint-derived prefix, then select the ECS-enabled AliDNS pool.
dofile(INSTALL_DIR .. "/generated/ecs-rules.lua")

-- Peers without a usable endpoint, and any other permitted clients, use
-- AliDNS without dnsdist adding an ECS option.
addAction(
  AllRule(),
  PoolAction("china-noecs"),
  { name = "default-alidns-without-ecs" }
)
